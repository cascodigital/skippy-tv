# Example for a new Docker host (folders ./app and ./bridge, filled by vidaa/deploy.sh).
# Replace the <placeholders> with the values from house.json.
services:
  skippy-vidaa-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8780:80"]
    volumes: ["./app:/usr/share/nginx/html:ro", "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
  skippy-vidaa-bridge:
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["python3", "-I", "-u", "tvbridge.py"]
    environment:
      TZ: America/Sao_Paulo
      SIDEE_HOME: /app/sideehome
      TV_HOST: <vidaa-tv-ip>                                # IP fixo da TV (reserva DHCP)
      CARDS: http://<docker-host-ip>:8099                   # server.public_url
      SKIPPY_URL: http://<vidaa-host>:8780/skippy.html      # devices[].vidaa.web + /skippy.html
      PORT: "8781"
    ports: ["8781:8781"]
    volumes: ["./bridge:/app"]
